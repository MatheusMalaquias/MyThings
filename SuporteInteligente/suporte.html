<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suporte Inteligente</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #14171a;
    --bg-panel: #1b1f23;
    --bg-bubble-bot: #21262b;
    --bg-bubble-user: #2a3a3f;
    --ink: #e9ecef;
    --ink-dim: #8b939c;
    --accent: #f2a93b;
    --accent-dim: #7a5a24;
    --signal: #3e7c74;
    --danger: #d9695f;
    --border: #2a2f34;
    --radius: 14px;
    --font-body: 'Inter', system-ui, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .app {
    width: 100%;
    max-width: 560px;
    height: min(720px, 92vh);
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 20px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 30px 80px -30px rgba(0,0,0,0.6);
  }

  .header {
    padding: 18px 22px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .pulse {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--signal);
    box-shadow: 0 0 0 0 rgba(62,124,116,0.6);
    animation: pulse 2.4s infinite;
    flex-shrink: 0;
  }

  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(62,124,116,0.55); }
    70%  { box-shadow: 0 0 0 8px rgba(62,124,116,0); }
    100% { box-shadow: 0 0 0 0 rgba(62,124,116,0); }
  }

  .pulse.thinking { background: var(--accent); animation-duration: 0.9s; }

  .header-text h1 {
    font-size: 15px;
    font-weight: 600;
    margin: 0;
    letter-spacing: 0.2px;
  }

  .header-text p {
    margin: 2px 0 0;
    font-size: 12px;
    color: var(--ink-dim);
    font-family: var(--font-mono);
  }

  .log {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .log::-webkit-scrollbar { width: 8px; }
  .log::-webkit-scrollbar-thumb { background: var(--border); border-radius: 8px; }

  .row {
    display: flex;
    flex-direction: column;
    max-width: 84%;
    gap: 4px;
  }

  .row.user { align-self: flex-end; align-items: flex-end; }
  .row.bot  { align-self: flex-start; align-items: flex-start; }

  .tag {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: var(--ink-dim);
    padding: 0 4px;
  }

  .bubble {
    padding: 11px 15px;
    border-radius: var(--radius);
    font-size: 14.5px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-wrap: break-word;
  }

  .row.bot .bubble {
    background: var(--bg-bubble-bot);
    border: 1px solid var(--border);
    border-top-left-radius: 4px;
  }

  .row.user .bubble {
    background: var(--bg-bubble-user);
    border-top-right-radius: 4px;
  }

  .row.bot .bubble.error {
    border-color: var(--danger);
    color: #f0b3ad;
  }

  .typing {
    display: inline-flex;
    gap: 4px;
    padding: 4px 2px;
  }

  .typing span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--ink-dim);
    animation: blink 1.2s infinite;
  }

  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }

  @keyframes blink {
    0%, 80%, 100% { opacity: 0.25; transform: translateY(0); }
    40% { opacity: 1; transform: translateY(-2px); }
  }

  .composer {
    display: flex;
    gap: 10px;
    padding: 16px;
    border-top: 1px solid var(--border);
    background: var(--bg-panel);
  }

  .composer input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 14px;
    outline: none;
    transition: border-color 0.15s ease;
  }

  .composer input:focus { border-color: var(--accent-dim); }
  .composer input::placeholder { color: var(--ink-dim); }

  .composer button {
    background: var(--accent);
    color: #1b1300;
    border: none;
    border-radius: 12px;
    padding: 0 18px;
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.3px;
    cursor: pointer;
    transition: filter 0.15s ease, transform 0.05s ease;
  }

  .composer button:hover { filter: brightness(1.08); }
  .composer button:active { transform: scale(0.97); }
  .composer button:disabled { opacity: 0.5; cursor: not-allowed; }

  .empty-hint {
    color: var(--ink-dim);
    font-size: 13px;
    text-align: center;
    margin: auto;
    padding: 0 30px;
    line-height: 1.6;
  }

  .empty-hint .k { color: var(--accent); font-family: var(--font-mono); }
</style>
</head>
<body>

<div class="app">
  <div class="header">
    <div class="pulse" id="statusPulse"></div>
    <div class="header-text">
      <h1>Suporte Inteligente</h1>
    </div>
  </div>

  <div class="log" id="log">
    <div class="empty-hint">Pergunte algo sobre o nosso setor.<br>As respostas vêm <span class="k">só</span> da nossa base de conhecimento.</div>
  </div>

  <div class="composer">
    <input type="text" id="input" placeholder="Digite sua pergunta..." autocomplete="off">
    <button id="sendBtn">ENVIAR</button>
  </div>
</div>

<script>
  // ====== CONFIGURAÇÃO ======
  // Troque pela URL do seu Webhook do n8n (nó "Webhook" -> Production URL)
  const WEBHOOK_URL = "https://SEU-N8N.dominio.com/webhook/suporte-chat";
  // ===========================

  const log = document.getElementById('log');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('sendBtn');
  const pulse = document.getElementById('statusPulse');
  const statusLabel = document.getElementById('statusLabel');

  let hintCleared = false;

  function clearHint() {
    if (!hintCleared) {
      log.innerHTML = '';
      hintCleared = true;
    }
  }

  function addMessage(text, who) {
    clearHint();
    const row = document.createElement('div');
    row.className = 'row ' + who;

    const tag = document.createElement('div');
    tag.className = 'tag';
    tag.textContent = who === 'user' ? 'você' : 'suporte';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;

    row.appendChild(tag);
    row.appendChild(bubble);
    log.appendChild(row);
    log.scrollTop = log.scrollHeight;
    return bubble;
  }

  function addTyping() {
    clearHint();
    const row = document.createElement('div');
    row.className = 'row bot';
    row.id = 'typingRow';

    const tag = document.createElement('div');
    tag.className = 'tag';
    tag.textContent = 'suporte';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = '<span class="typing"><span></span><span></span><span></span></span>';

    row.appendChild(tag);
    row.appendChild(bubble);
    log.appendChild(row);
    log.scrollTop = log.scrollHeight;
  }

  function removeTyping() {
    const row = document.getElementById('typingRow');
    if (row) row.remove();
  }

  function setThinking(isThinking) {
    pulse.classList.toggle('thinking', isThinking);
    statusLabel.textContent = isThinking ? 'consultando a base...' : 'base consultada em tempo real';
  }

  async function sendQuestion() {
    const question = input.value.trim();
    if (!question) return;

    addMessage(question, 'user');
    input.value = '';
    sendBtn.disabled = true;
    setThinking(true);
    addTyping();

    try {
      const response = await fetch(WEBHOOK_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pergunta: question })
      });

      if (!response.ok) throw new Error('status ' + response.status);

      const data = await response.json();
      const resposta = data.resposta || data.answer || data.output || 'Não consegui obter uma resposta agora.';

      removeTyping();
      addMessage(resposta, 'bot');
    } catch (err) {
      removeTyping();
      const bubble = addMessage('Não consegui falar com o suporte agora. Tenta de novo em instantes.', 'bot');
      bubble.classList.add('error');
      console.error('Erro ao consultar o webhook:', err);
    } finally {
      sendBtn.disabled = false;
      setThinking(false);
      input.focus();
    }
  }

  sendBtn.addEventListener('click', sendQuestion);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') sendQuestion();
  });
</script>

</body>
</html>
