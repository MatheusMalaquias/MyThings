<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Criar senha · Portal Jurídico</title>
  <link rel="stylesheet" href="./Styles/style.css" />
</head>
<body>

  <div class="auth-shell">

    <aside class="auth-brand">
      <div class="auth-brand-top">
        <div class="seal">§</div>
        <span class="auth-brand-name">Portal Jurídico</span>
      </div>

      <div class="auth-brand-main">
        <h1>Bem-vindo ao escritório.</h1>
        <p>Falta só um passo: criar sua senha de acesso.</p>
      </div>

      <div class="auth-brand-foot">
        <span class="dot"></span>
        Integração JUDIT ativa
      </div>
    </aside>

    <main class="auth-form-side">
      <div class="auth-card">
        <h2>Criar sua senha</h2>
        <p class="auth-sub" id="convite-sub">Escolha uma senha de acesso.</p>

        <p class="auth-error" id="convite-error" hidden></p>
        <p class="form-feedback success" id="convite-sucesso" hidden></p>

        <form id="form-convite" novalidate>
          <div class="field">
            <label for="senha">Nova senha</label>
            <input type="password" id="senha" autocomplete="new-password" required minlength="6" />
          </div>

          <div class="field">
            <label for="senha-confirma">Confirme a senha</label>
            <input type="password" id="senha-confirma" autocomplete="new-password" required minlength="6" />
          </div>

          <button type="submit" class="btn-primary" id="convite-btn">Criar senha e entrar</button>
        </form>
      </div>
    </main>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="./Scripts/convite.js"></script>
</body>
</html>
