<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./Styles/Tokens.css" />
  <link rel="stylesheet" href="./Styles/Buttons.css" />
  <link rel="stylesheet" href="./Styles/Personalizar.css" />
  <link rel="stylesheet" href="./Styles/Nav.css" />
  <title>Personalizar Roupa - Julio's Stamparia</title>
</head>

<body>

  <header class="site-header">
    <a href="Products.html">
      <img src="./Images/Julio's Logo.png" alt="Julio's Stamparia Logo" class="site-logo" />
    </a>
    <nav class="site-nav">
      <a href="Products.html">Produtos</a>
      <a href="Personalizar.html">Personalizar</a>
      <a href="Admin.html" id="link-admin" class="admin-link" hidden>Painel Admin</a>
    </nav>
  </header>

  <div class="container">

    <!-- Parte de personalização -->
    <div class="personalizacao">
      <h2>Personalize sua Roupa</h2>

      <!-- Upload de imagem -->
      <input type="file" id="imageUpload" accept="image/*" />

      <!-- Área visual da peça com imagem e personalização -->
      <div class="shirt-container">
        <img src="./Images/camiseta-frente.png" alt="Peça de roupa" class="shirt" id="shirtImage" />
        <div class="overlay-image" id="overlay"></div>
      </div>
    </div>

    <!-- Parte do formulário -->
    <form class="pedido" id="pedido-form">
      <input type="text" name="nome" placeholder="Seu nome" required />
      <input type="email" name="email" placeholder="Seu e-mail" required />

      <!-- Seletor de tipo de peça -->
      <select id="tipo-peca" name="tipo_peca">
        <option value="camiseta">Camiseta</option>
        <option value="camisa">Camisa</option>
        <option value="blusa">Blusa de Frio</option>
      </select>

      <!-- Seletor de frente ou costas -->
      <select id="lado-peca" name="lado_peca">
        <option value="frente">Frente</option>
        <option value="costas">Costas</option>
      </select>

      <select name="genero" required>
        <option value="">Gênero</option>
        <option value="Masculina">Masculina</option>
        <option value="Feminina">Feminina</option>
      </select>

      <select name="tamanho" required>
        <option value="">Selecione o tamanho</option>
        <option value="P">P</option>
        <option value="M">M</option>
        <option value="G">G</option>
        <option value="GG">GG</option>
      </select>

      <select name="tecido" required>
        <option value="">Selecione o tecido</option>
        <option value="Algodão">Algodão</option>
        <option value="Poliéster">Poliéster</option>
        <option value="Dry Fit">Dry Fit</option>
      </select>

      <select name="cor" required>
        <option value="">Selecione a cor da peça</option>
        <option value="Branca">Branca</option>
        <option value="Preta">Preta</option>
        <option value="Vermelha">Vermelha</option>
        <option value="Azul">Azul</option>
      </select>

      <textarea name="mensagem" placeholder="Detalhes do pedido" rows="4" required></textarea>
      <p id="pedido-feedback" class="form-feedback" role="alert"></p>
      <button type="submit" class="button-liquid">Enviar Pedido</button>
    </form>

  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/interactjs/dist/interact.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./Scripts/Supabaseconfig.js"></script>
  <script src="./Scripts/Nav.js"></script>
  <script src="./Scripts/Adminnav.js"></script>
  <script src="./Scripts/Personalizar.js"></script>
</body>
</html>
