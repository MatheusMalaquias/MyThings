<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registrar - Julio's Stamparia</title>
  <link rel="stylesheet" href="./Styles/Tokens.css" />
  <link rel="stylesheet" href="./Styles/Buttons.css" />
  <link rel="stylesheet" href="./Styles/Auth.css" />
</head>

<body>
  <main>
    <header>
      <img src="./Images/Julio's Logo.png" alt="Julio's Stamparia logo" />
    </header>

    <h2>Registrar</h2>

    <form id="register-form" novalidate>
      <input type="text" placeholder="Nome completo" id="register-nome" required minlength="2" />
      <input type="email" placeholder="E-mail" id="register-email" required />
      <input type="password" placeholder="Senha" id="register-password" required minlength="6" />
      <p id="register-feedback" class="form-feedback" role="alert"></p>
      <button type="submit" class="button">
        <span class="liquid"></span>
        <span class="btn-txt">Registrar</span>
      </button>
    </form>

    <p>Já tem conta?</p>
    <a href="Index.html" class="button">
      <span class="liquid"></span>
      <span class="btn-txt">Entrar</span>
    </a>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./Scripts/Supabaseconfig.js"></script>
  <script src="./Scripts/Auth.js"></script>
</body>
</html>
