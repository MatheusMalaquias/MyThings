<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Roupas - Julio's Stamparia</title>
  <link rel="stylesheet" href="./Styles/tokens.css" />
  <link rel="stylesheet" href="./Styles/Products.css" />
  <link rel="stylesheet" href="./Styles/Nav.css" />
</head>
<body>
  <!-- ===== Cabeçalho ===== -->
  <header class="site-header">
    <div class="logo-personalizar">
      <a href="Products.html">
        <img src="./Images/Julio's Logo.png" alt="Logo da Julio's Stamparia" class="site-logo" />
      </a>
      <nav class="site-nav">
        <a href="Products.html">Produtos</a>
        <a href="Personalizar.html">Personalizar</a>
        <a href="Admin.html" id="link-admin" class="admin-link" hidden>Painel Admin</a>
      </nav>
    </div>

    <div class="header-actions">
      <div class="carrinho">
        <button class="carrinho-btn" aria-label="Abrir carrinho" aria-haspopup="true"></button>
        <span id="carrinho-contador">0</span>

        <div class="carrinho-painel">
          <h4>Seu carrinho</h4>
          <div id="carrinho-lista"></div>
          <div class="carrinho-total">
            <span>Total</span>
            <span id="carrinho-total-valor">R$ 0,00</span>
          </div>
          <button id="finalizar-pedido" class="finalizar-pedido-btn" disabled>Finalizar pedido</button>
        </div>
      </div>
      <button class="logout">Sair</button>
    </div>
  </header>

  <!-- ===== Conteúdo principal ===== -->
  <main>
    <section class="produtos">
      <h2>Roupas Disponíveis</h2>

      <div class="abas-genero" role="tablist">
        <button class="aba-genero ativa" data-genero="Todos" role="tab" aria-selected="true">Todos</button>
        <button class="aba-genero" data-genero="Masculino" role="tab" aria-selected="false">Masculino</button>
        <button class="aba-genero" data-genero="Feminino" role="tab" aria-selected="false">Feminino</button>
      </div>

      <div id="produto-lista"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./Scripts/supabaseConfig.js"></script>
  <script src="./Scripts/Nav.js"></script>
  <script src="./Scripts/AdminNav.js"></script>
  <script src="./Scripts/Cart.js"></script>
</body>
</html>
